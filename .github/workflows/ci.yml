# Container pipeline: build -> Trivy scan -> push to Huawei Cloud SWR.
# Runs on PRs too (build + scan only, no push) so a broken Dockerfile
# never reaches master. Push happens only on master pushes, so secrets
# are never needed on pull_request events.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      IMAGE_NAME: opengame
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Build (load into the local docker daemon so we can scan it
      # before anything is published).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Vulnerability gate: fail the run on fixable HIGH/CRITICAL findings.
      # ignore-unfixed keeps base-image noise out; relax severity here if
      # upstream node:20-alpine lags a patch.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Publish: master pushes only. PRs stop after the scan so secrets
      # are never needed on pull_request events.
      - name: Login to Huawei Cloud SWR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USER }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Tag and push to SWR
        if: github.event_name == 'push'
        run: |
          REF="${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/${IMAGE_NAME}"
          docker tag "${IMAGE_NAME}:${{ steps.meta.outputs.short_sha }}" "${REF}:${{ steps.meta.outputs.short_sha }}"
          docker tag "${IMAGE_NAME}:${{ steps.meta.outputs.short_sha }}" "${REF}:latest"
          docker push "${REF}:${{ steps.meta.outputs.short_sha }}"
          docker push "${REF}:latest"
